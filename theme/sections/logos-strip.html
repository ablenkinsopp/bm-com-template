<!--
  templateType: section
  label: Home Logos Strip
  isAvailableForNewContent: true
  screenshotPath: ../images/section-previews/logos-strip.png
  description: "Client logos that break the flow of the page. Only for use on the homepage"
-->
{% dnd_section
    background_color={{ context.background_color or "none" }},
  vertical_alignment="MIDDLE"
%}
  {% dnd_column
  %}
        {% dnd_row %}
            {% dnd_module 
                path='../modules/logos-strip.module',
                animate=True
            %}
            {% end_dnd_module %}
        {% end_dnd_row %}
    {% end_dnd_column %}
{% end_dnd_section %}
