{% from '../../macros/button.html' import button %}

<div class="w-full flex flex-col gap-6 md:gap-12 justify-center md:items-center">
    <h3 class="text-white text-3xl md:text-4xl font-light md:text-center max-w-5xl">{{ module.title }}</h3>
    
    <div class="max-w-5xl">
        {% if module.image_mobile.src %}
            <img class="lg:hidden" src="{{ module.image_mobile.src }}" alt="{{ module.image_field.alt }}" />
        {% endif %}
        <img class="{{ module.image_mobile ? 'hidden lg:block' : '' }}" src="{{ module.image_field.src }}" alt="{{ module.image_field.alt }}" />
    </div>

    {{ button(module.button_text, module.button_link) }}
</div>
